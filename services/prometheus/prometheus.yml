# Committed directly (not terraform-managed): no secrets.
global:
  scrape_interval: 15s

# Claude Code pushes its metrics over OTLP instead of being scraped.
otlp:
  keep_identifying_resource_attributes: true

storage:
  tsdb:
    out_of_order_time_window: 30m

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # node_exporter on the host (hosts/MacBookPro-minami/darwin.nix).
  - job_name: node
    static_configs:
      - targets: ["host.docker.internal:9100"]
