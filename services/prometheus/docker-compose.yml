# Committed directly (not terraform-managed): no secrets, local-only. Start
# via `terraform apply` in terraform/local/.
services:
  prometheus:
    image: docker.io/prom/prometheus:v3.14.0
    restart: always
    # The image's default args plus Claude Code's OTLP metrics.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-otlp-receiver
      - --enable-feature=created-timestamp-zero-ingestion
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      # 9090 is taken by langfuse's minio.
      - 127.0.0.1:9095:9090
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  prometheus_data:
    driver: local
