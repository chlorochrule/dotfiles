# Committed directly (not terraform-managed): local-only Prometheus, ports
# restricted to 127.0.0.1. Scrape targets: ./prometheus.yml (no secrets,
# committed directly too). Grafana datasource registration is
# Terraform-managed (terraform/local/prometheus.tf) — start via
# `terraform apply` in terraform/local/.
#
# See .claude/rules/services-terraform.md for why extra_hosts isn't set here.
services:
  prometheus:
    image: docker.io/prom/prometheus:v3.14.0
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      # 9095, not 9090: 9090 is taken by langfuse's minio (S3 API). Container
      # port stays the default 9090.
      - 127.0.0.1:9095:9090
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  prometheus_data:
    driver: local
