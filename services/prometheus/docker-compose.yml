# ローカルMacでの個人利用専用(外部公開しない)Prometheus。ポートは127.0.0.1限定。
# スクレイプ対象の定義は./prometheus.yml(秘密情報を含まないため直接コミット、
# terraform管理外)。Grafanaへのデータソース登録はterraform/local/grafana.tfで
# 行うため、起動は`terraform/local/`で`terraform apply`を実行してください。
#
# ホストmacOS上でnix-darwin経由起動しているnode_exporter(127.0.0.1:9100、
# terraform管理外。hosts/MacBookPro-minami/darwin.nix参照)は、Rancher Desktopが
# 提供するhost.docker.internal(127.0.0.1限定のホストサービスにも到達できる)
# 経由でスクレイプする。extra_hostsで明示上書きするとLinux流のブリッジ
# ゲートウェイIPになり127.0.0.1限定のサービスに届かなくなるため指定しない。
services:
  prometheus:
    image: docker.io/prom/prometheus:v3.14.0
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      # 9090はservices/langfuse/docker-compose.ymlのminio(S3 API)が既に使用しているため
      # ホスト側ポートは9095にずらす(コンテナ内部は既定の9090のまま)
      - 127.0.0.1:9095:9090
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  prometheus_data:
    driver: local
