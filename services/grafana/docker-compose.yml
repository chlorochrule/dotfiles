# ローカルMacでの個人利用専用(外部公開しない)Grafana。ポートは127.0.0.1限定。
# ダッシュボード/データソース/アカウントのprovisioningはterraform/local/grafana.tfで
# 行うため、起動は`terraform/local/`で`terraform apply`を実行してください
# (.envの生成、admin初期パスワードの発行まで含みます)。
#
# 別のdocker-compose project(services/prometheus/)で起動しているPrometheus(127.0.0.1限定)は
# Rancher Desktopが提供するhost.docker.internal経由で参照する(terraform/local/
# grafana.tfのgrafana_data_source.prometheus)。extra_hostsで明示上書きすると
# Linux流のブリッジゲートウェイIPになり127.0.0.1限定のサービスに届かなくなるため
# 指定しない。
services:
  grafana:
    image: docker.io/grafana/grafana:13.0.2
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin} # CHANGEME
      # Langfuseのトレースデータ(ClickHouse)をGrafanaダッシュボードで可視化するために使う
      # (terraform/local/langfuse_grafana.tf参照)。公式署名済みプラグインのため
      # GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINSは不要。
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource 4.21.2
    ports:
      - 127.0.0.1:3001:3000
    volumes:
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  grafana_data:
    driver: local
