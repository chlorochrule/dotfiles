# Committed directly (not terraform-managed): no secrets, local-only. Start
# via `terraform apply` in terraform/local/.
services:
  grafana:
    image: docker.io/grafana/grafana:13.0.2
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin} # CHANGEME
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      # SYNC so `up --wait` waits for the plugin install.
      GF_PLUGINS_PREINSTALL_SYNC: grafana-clickhouse-datasource@4.21.2
    ports:
      - 127.0.0.1:3001:3000
    volumes:
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  grafana_data:
    driver: local
