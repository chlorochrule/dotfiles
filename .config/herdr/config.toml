onboarding = false
# herdr configuration
# https://herdr.dev/docs/configuration/

[keys]
# Kept from the old tmux config, for muscle memory.
prefix = "ctrl+g"

# Old tmux's "-n" (no-prefix) binds, kept as alt+<key>.
new_workspace = "alt+n"
previous_workspace = "alt+j"
next_workspace = "alt+k"
close_workspace = "alt+q"

new_tab = "alt+c"
previous_tab = "alt+h"
next_tab = "alt+l"

split_vertical = "alt+backslash"
split_horizontal = "alt+minus"
close_pane = "alt+w"

# Pops tig up temporarily; closes automatically on exit.
[[keys.command]]
key = "ctrl+t"
type = "popup"
command = "tig"
width = "90%"
height = "90%"

[ui]
# Skip the name prompt; create the tab immediately.
prompt_new_tab_name = false
agent_panel_sort = "priority"

# Both are for typing Japanese; they're under [experimental], so the key
# names can change between herdr releases (checked against 0.8.0).
[experimental]
# Puts the IME candidate window at the cursor instead of the screen corner.
reveal_hidden_cursor_for_cjk_ime = true
# Switches to an ASCII input source while the prefix (ctrl+g) is held, so
# pane/tab keys still work in the middle of Japanese input.
switch_ascii_input_source_in_prefix = true
