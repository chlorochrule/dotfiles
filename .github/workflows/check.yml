name: check

on:
  push:
    branches: [main]
  pull_request:
  # Run by update-flake-lock.yml on its PR branch (see the comment there).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # Linux is enough: nothing here builds the darwin system, it's only
    # evaluated (drvPath), and eval is platform-independent.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans the whole history
      - uses: cachix/install-nix-action@v31

      # Each step is a Makefile target, so `make check` runs the same thing
      # locally (terraform fmt runs in terraform.yml instead, only when it
      # can be affected). Tools come from flake.lock's nixpkgs (--inputs-from .), the
      # same versions as home.packages / conform.nvim.
      - name: nix flake check
        run: make flake-check

      - name: Evaluate every host
        run: make eval

      - name: nixfmt
        run: make nixfmt

      - name: stylua
        run: make stylua

      - name: editorconfig-checker
        run: make editorconfig

      - name: shellcheck
        run: make shellcheck

      - name: actionlint
        run: make actionlint

      - name: Claude Code settings schema
        run: make claude-settings

      - name: docker-compose / dependabot schemas
        run: make schemas

      - name: Claude Code script tests
        run: make test

      # Also runs as a pre-commit hook locally (init.templateDir), but that
      # only covers clones made after it was set up.
      - name: gitleaks
        run: make gitleaks
