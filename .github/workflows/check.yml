name: check

on:
  push:
    branches: [main]
  pull_request:
  # Run by update-flake-lock.yml on its PR branch.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # Linux is enough: the darwin system is only evaluated, never built.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans the whole history
      - uses: cachix/install-nix-action@v31

      # Each step is a Makefile target, so `make check` runs the same thing.
      - name: nix flake check
        run: make flake-check

      - name: Evaluate every host
        run: make eval

      - name: nixfmt
        run: make nixfmt

      - name: stylua
        run: make stylua

      - name: editorconfig-checker
        run: make editorconfig

      - name: shellcheck
        run: make shellcheck

      - name: actionlint
        run: make actionlint

      - name: Claude Code settings schema
        run: make claude-settings

      - name: docker-compose / dependabot schemas
        run: make schemas

      - name: Claude Code script tests
        run: make test

      - name: gitleaks
        run: make gitleaks
