name: terraform

# Split out of check.yml: terraform is unfree and builds from source.
on:
  push:
    branches: [main]
    paths: &paths
      - "terraform/**"
      - flake.lock
      - Makefile
      - .github/workflows/terraform.yml
  pull_request:
    paths: *paths
  # Run by update-flake-lock.yml on its PR branch.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31

      - name: terraform fmt
        run: make terraform-fmt

      - name: terraform validate
        run: make terraform-validate
