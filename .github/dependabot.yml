# Keeps the actions used in .github/workflows/ up to date. Only
# github-actions: flake inputs are updated by update-flake-lock.yml, and the
# pinned images in services/ go through .claude/skills/upgrade-services
# (dashboard checks) instead of blind bumps.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: CI
